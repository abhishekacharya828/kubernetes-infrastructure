# Application
nameOverride: payment-frontend
namespace: payment

replicaCount: 4

image:
  repository: 3.7.142.197:32000/frontend-website_frontend
  tag: v3
  pullPolicy: Always

service:
  type: NodePort
  port: 80
  targetPort: 2010
  nodePort: 30010

resources:
  requests:
    memory: 128Mi
    cpu: 100m
  limits:
    memory: 256Mi
    cpu: 300m

autoscaling:
  enabled: true
  minReplicas: 4
  maxReplicas: 10
  cpuUtilization: 70
  memoryUtilization: 80
