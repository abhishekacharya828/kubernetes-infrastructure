apiVersion: apps/v1
kind: Deployment

metadata:
  name: racube-frontend
  namespace: racube

spec:
  replicas: 2

  selector:
    matchLabels:
      app: racube-frontend

  template:
    metadata:
      labels:
        app: racube-frontend

        

    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - racube-frontend
              topologyKey: kubernetes.io/hostname  

      containers:
      - name: frontend

        image: 3.7.142.197:32000/racube-frontend:v1

        imagePullPolicy: Always

        ports:
        - containerPort: 3000

        resources:
          requests:
            memory: "528Mi"
            cpu: "200m"

          limits:
            memory: "756Mi"
            cpu: "700m"

        livenessProbe:
          httpGet:
            path: /
            port: 3000

          initialDelaySeconds: 15
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /
            port: 3000

          initialDelaySeconds: 5
          periodSeconds: 5
