# 1. ServiceAccount for dashboard admin
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard-admin
  namespace: kubernetes-dashboard

---
# 2. Bind it to cluster-admin role
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dashboard-admin-binding

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin

subjects:
  - kind: ServiceAccount
    name: dashboard-admin
    namespace: kubernetes-dashboard

---
# 3. Expose Dashboard via NodePort
apiVersion: v1
kind: Service

metadata:
  name: kubernetes-dashboard-nodeport
  namespace: kubernetes-dashboard

spec:
  type: NodePort

  selector:
    app.kubernetes.io/name: kong

  ports:
    - protocol: TCP
      port: 443
      targetPort: 8443
      nodePort: 30443
