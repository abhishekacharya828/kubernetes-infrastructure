apiVersion: apps/v1
kind: Deployment

metadata:
  name: registry-ui
  namespace: registry-ui

spec:
  replicas: 1

  selector:
    matchLabels:
      app: registry-ui

  template:
    metadata:
      labels:
        app: registry-ui

    spec:
      containers:
      - name: registry-ui

        image: joxit/docker-registry-ui:latest

        env:
        - name: SINGLE_REGISTRY
          value: "true"

        - name: REGISTRY_TITLE
          value: "MicroK8s Registry"

        - name: DELETE_IMAGES
          value: "true"

        - name: REGISTRY_URL
          value: "http://3.7.142.197:32000"

        ports:
        - containerPort: 80
