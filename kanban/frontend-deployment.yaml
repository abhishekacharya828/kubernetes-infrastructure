apiVersion: apps/v1
kind: Deployment

metadata:
  name: kanban-frontend
  namespace: kanban

spec:
  replicas: 2

  selector:
    matchLabels:
      app: kanban-frontend

  template:
    metadata:
      labels:
        app: kanban-frontend

    spec:
      containers:
      - name: frontend

        image: 3.7.142.197:32000/kanban-frontend:v1

        imagePullPolicy: Always

        ports:
        - containerPort: 80

        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"

          limits:
            memory: "256Mi"
            cpu: "300m"

        livenessProbe:
          httpGet:
            path: /
            port: 80

          initialDelaySeconds: 15
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /
            port: 80

          initialDelaySeconds: 5
          periodSeconds: 5
