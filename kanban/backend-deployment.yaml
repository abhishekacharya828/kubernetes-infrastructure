apiVersion: apps/v1
kind: Deployment

metadata:
  name: kanban-backend
  namespace: kanban

spec:
  replicas: 2

  selector:
    matchLabels:
      app: kanban-backend

  template:
    metadata:
      labels:
        app: kanban-backend

    spec:
      containers:
      - name: backend

        image: 3.7.142.197:32000/kanban-backend:v1

        imagePullPolicy: Always

        ports:
        - containerPort: 8000 

        volumeMounts:
        - name: settings-volume
          mountPath: /app/core/settings.py
          subPath: settings.py    

        env:
        - name: MYSQL_HOST
          value: "ls-46323a0fd3a07d941f5f88ee740bc70ec1d9a4b8.cx8iewg0o38k.ap-south-1.rds.amazonaws.com"

        - name: MYSQL_USER
          value: "dbmasteruser"

        - name: MYSQL_PASSWORD
          value: "Zxcvbnm2025"

        - name: MYSQL_DATABASE
          value: "pooja_app"

        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"

          limits:
            memory: "512Mi"
            cpu: "500m"

        livenessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 3

        readinessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 3
          
      volumes:
      - name: settings-volume
        configMap:
          name: kanban-settings